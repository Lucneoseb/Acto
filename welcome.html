<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Le Studio vit sous /coaching/…, /match/… : sans base, les URL relatives
     (./js/…, et les fetch paresseux de data/warmups-*.json) se resoudraient
     depuis /coaching/ et echoueraient au rechargement. -->
<base href="/" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Acto · The Impro Studio — préparer et animer matchs, spectacles et coachings d'impro" />
<meta name="theme-color" content="#0c0814" />
<title>Acto — Impro Suite</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260716" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=2026090507" />
<link rel="stylesheet" href="suite.css?v=2026090507" />
</head>
<body class="suite-body suite-auth-checking">
<a class="skip-link" href="#suiteMain" data-i18n="skipToContent">Aller au contenu</a>
  <!-- Shown until the login gate (js/suite/auth.js) confirms a session.
       Signed-out visitors are redirected to /login. -->
  <div class="suite-auth-overlay" id="suiteAuthOverlay" aria-hidden="true">
    <div class="suite-auth-spinner"></div>
  </div>

  <!-- Same theatre backdrop as the rest of the app. -->
  <div class="stage-backdrop" aria-hidden="true">
    <div class="spotlight spotlight-1"></div>
    <div class="spotlight spotlight-2"></div>
    <div class="spotlight spotlight-3"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- Top chrome: locale + Inspirations + quick-draw link -->
  <div class="top-actions suite-topbar">
    <a class="top-trigger suite-home" id="suiteHomeBtn" href="/studio" data-nav="#/" aria-label="Accueil">
      <span aria-hidden="true" style="font-size:1.05rem;">🏠</span>
      <span data-i18n="navHome">Accueil</span>
    </a>
    <a class="top-trigger inspire-trigger" href="./inspirations.html" aria-label="Inspirations">
      <span aria-hidden="true" style="font-size:1.05rem;">🎭</span>
      <span data-i18n="inspireBtn">Inspirations</span>
    </a>
    <a class="top-trigger suite-quickdraw" href="./quickgame.html" aria-label="Match rapide">
      <span aria-hidden="true" style="font-size:1.05rem;">🎲</span>
      <span data-i18n="backToApp">Match rapide</span>
    </a>
    <a class="top-trigger suite-quickwarmup" href="./warmups.html?draw=1" aria-label="Échauffement rapide">
      <span aria-hidden="true" style="font-size:1.05rem;">🔥</span>
      <span data-i18n="quickWarmup">Échauffement rapide</span>
    </a>
    <div class="suite-account" id="suiteAccount"><!-- user avatar menu (js/suite/account.js) --></div>
  </div>

  <header class="hero suite-hero">
    <a class="hero-logo-link" href="/studio" data-nav="#/" aria-label="Acto - The Impro Studio">
      <img class="hero-logo suite-hero-logo" src="./assets/logo.png?v=20260716" alt="Acto - The Impro Studio" />
    </a>
  </header>

  <main class="suite-shell" id="suiteMain" tabindex="-1">
    <nav class="suite-sectionnav" id="suiteSectionNav" hidden aria-label="Sections"></nav>
    <div id="suiteRoot" class="suite-root"><!-- sections render here --></div>
  </main>

  <footer class="footer suite-footer">
    <p id="suiteFooter"></p>
  </footer>

  <!-- Auth gate: the Studio requires a logged-in account. -->
  <script src="/vendor/supabase-js-2.47.10.min.js" integrity="sha384-8ljL080xacUYrqBXUJRcP68fd1dVCh9qK/xi9QMzxUgOVNycXp0s6mBZAjBMp9W0"></script>
  <!-- Local QR generator for the "Écran à distance" share dialog (no 3rd-party QR API). -->
  <script src="/vendor/qrcode-generator-1.4.4.min.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" defer></script>
  <script src="./js/config.js?v=2026090507"></script>
  <script src="./js/suite/auth.js?v=2026090507"></script>

  <!-- Data bundle (locales/ui/data) then the suite modules. -->
  <script src="./data/all.js?v=2026090507"></script>
  <script src="./js/suite/i18n.js?v=2026090507"></script>
  <script src="./js/suite/core.js?v=2026090507"></script>
  <script src="./js/suite/match.js?v=2026090507"></script>
  <script src="./js/suite/live.js?v=2026090507"></script>
  <script src="./js/suite/discover.js?v=2026090507"></script>
  <script src="./js/suite/teams-db.js?v=2026090507"></script>
  <script src="./js/suite/teams.js?v=2026090507"></script>
  <script src="./js/suite/contribute.js?v=2026090507"></script>
  <script src="./js/suite/account.js?v=2026090507"></script>
  <script src="./js/suite/shell.js?v=2026090507"></script>
</body>
</html>
