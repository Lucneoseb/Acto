           D'où « le record n'a pas de son ». pickMime() exige désormais l'AAC.
       (2) les signaux de caucus et d'impro n'existaient pas. Et un son joué sur
           le haut-parleur n'aurait pas suffi : l'annulation d'écho le retire
           justement du micro. Micro et signaux passent donc par un même graphe
           Web Audio, dont la sortie EST la piste son du fichier — le résultat ne
           dépend ni de l'acoustique de la pièce, ni du navigateur. */
    function ensureAudio() {
      // Dans un geste utilisateur : iOS et Chrome refusent de créer ou de
      // reprendre un AudioContext hors d'un clic.
      try {
        if (!audioCtx) { var AC = window.AudioContext || window.webkitAudioContext; audioCtx = AC ? new AC() : null; }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        if (audioCtx) {   // tampon muet joué dans le geste : débloque la sortie son sur iOS
          var b = audioCtx.createBuffer(1, 1, 22050), src = audioCtx.createBufferSource();
          src.buffer = b; src.connect(audioCtx.destination); src.start(0);
        }
      } catch (e) { audioCtx = null; }
      return audioCtx;
    }
    function wireMic() {
      // (Re)branche le micro du flux courant sur le mixeur — appelée à chaque
      // nouveau flux, un changement de caméra redemandant aussi le micro.
      if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
      if (!audioCtx || !stream || !stream.getAudioTracks || !stream.getAudioTracks().length) return;
      try {
        if (!mixDest) mixDest = audioCtx.createMediaStreamDestination();
        if (!micMeter) { micMeter = audioCtx.createAnalyser(); micMeter.fftSize = 512; }
        micSource = audioCtx.createMediaStreamSource(stream);
        micSource.connect(mixDest);    // vers le fichier
        micSource.connect(micMeter);   // vers le vu-mètre — JAMAIS vers les haut-parleurs (larsen)
      } catch (e) { micSource = null; }
    }
    function tone(freq, start, dur) {
      var ac = audioCtx; if (!ac) return;
      try {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = freq;
        o.connect(g);
        g.connect(ac.destination);          // l'improvisateur l'entend
        if (mixDest) g.connect(mixDest);    // et il est dans le fichier
        var t0 = ac.currentTime + start;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.start(t0); o.stop(t0 + dur + 0.03);
      } catch (e) { /* un signal manqué ne doit jamais casser l'enregistrement */ }
    }
    // Mêmes timbres que le direct, où le carillon ascendant signifie « temps écoulé ».
    // La fin du caucus et le début de l'impro tombent au même instant : un seul
    // signal « top départ » plutôt que deux sons superposés et confus.
    function sonDebutCaucus() { tone(880, 0, 0.16); tone(880, 0.22, 0.16); }
    function sonDebutImpro()  { tone(660, 0, 0.14); tone(990, 0.16, 0.4); }
    function sonFinImpro()    { tone(660, 0, 0.25); tone(880, 0.28, 0.25); tone(1180, 0.56, 0.45); }

    /* ── Caméra ────────────────────────────────────────────────────────── */
    function lirePref(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
    function ecrirePref(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function pisteVideo() { return stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null; }
    function reglagesPiste() { var tr = pisteVideo(); try { return (tr && tr.getSettings && tr.getSettings()) || {}; } catch (e) { return {}; } }
    function detecterOrientation() {
      var s = reglagesPiste(), tr = pisteVideo(), f = s.facingMode || "";
      // Safari ne renseigne pas toujours facingMode : le libellé prend le relais.
      if (!f && tr && tr.label) f = /back|rear|arri[eè]re|environment/i.test(tr.label) ? "environment" : "";
      camFacing = f;
    }
    function appliquerMiroirParDefaut() {
      // Préférence mémorisée PAR orientation : se voir en miroir face à soi, mais
      // pas quand on filme la scène avec la caméra arrière. Webcam de bureau
      // (orientation inconnue) : miroir, comme dans toutes les visios.
      var prefs = lirePref(MIRROR_KEY) || {}, cle = (camFacing === "environment") ? "environment" : "user";
      mirror = (typeof prefs[cle] === "boolean") ? prefs[cle] : (cle === "user");
    }
    function listerCameras() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) { camDevices = []; return Promise.resolve(); }
      // Les libellés ne sont remplis qu'APRÈS l'autorisation : on liste une fois
      // le premier flux obtenu, jamais avant.
      return navigator.mediaDevices.enumerateDevices().then(function (l) {
        camDevices = (l || []).filter(function (d) { return d.kind === "videoinput"; });
      }, function () { camDevices = []; });
    }
    function brancherFlux(st) {
      stream = st;
      try { if (camVideo) camVideo.srcObject = st; } catch (e) {}
      var pv = document.getElementById("defiSetupVideo"); if (pv) { try { pv.srcObject = st; } catch (e) {} }
      wireMic(); detecterOrientation(); appliquerMiroirParDefaut();
    }
    function changerCamera(deviceId) {
      // iOS n'autorise qu'une capture caméra à la fois : on libère l'ancienne
      // AVANT de redemander, sinon la nouvelle demande échoue.
      try { if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
      return navigator.mediaDevices.getUserMedia({ video: contraintesVideo({ deviceId: { exact: deviceId } }), audio: true }).then(function (st) {
        brancherFlux(st);
        try { localStorage.setItem(CAM_KEY, deviceId); } catch (e) {}
        return true;
      }, function () {
        // Caméra indisponible : retour à la frontale plutôt qu'un écran noir.
        return navigator.mediaDevices.getUserMedia({ video: contraintesVideo({ facingMode: "user" }), audio: true }).then(function (st) {
          brancherFlux(st); return false;
        });
      });
    }

    function clearTimer() { if (tk) { clearInterval(tk); tk = null; } }
    function stopStream() {
      if (rafId) { try { cancelAnimationFrame(rafId); } catch (e) {} rafId = 0; }
      if (meterRaf) { try { cancelAnimationFrame(meterRaf); } catch (e) {} meterRaf = 0; }
      if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
      try { if (compStream) compStream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} compStream = null;
      // compStream portait la piste du mixeur, que tr.stop() vient de tuer pour de
      // bon : on la recrée à la prise suivante, sinon « Refaire » serait muet.
      mixDest = null;
      try { if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} stream = null;
      try { if (camVideo) { camVideo.pause(); camVideo.srcObject = null; } } catch (e) {} camVideo = null;
      canvas = null; cctx = null; usingCanvas = false;
    }
    function revoke() { if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = null; } }
    function slug(s) { return String(s || "defi").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "defi"; }

    function pickMime() {
      var MR = window.MediaRecorder;
      if (!MR || !MR.isTypeSupported) { recMime = ""; recExt = "webm"; return; }
      // Prefer mp4 (widely accepted by share targets / iOS); fall back to webm.
      // AAC EXIGÉ dans le MP4 : sans précision, Chrome y mettait de l'Opus, que
      // QuickTime, iOS et les lecteurs Windows ne lisent pas — vidéo muette. Le MP4
      // générique reste en dernier recours pour Safari, qui y met de l'AAC lui-même.
      var prefs = [
        ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "mp4"],
        ["video/mp4;codecs=avc1,mp4a.40.2", "mp4"],
        ["video/webm;codecs=vp9,opus", "webm"],
        ["video/webm;codecs=vp8,opus", "webm"],
        ["video/mp4", "mp4"],
        ["video/webm", "webm"]
      ];
      for (var i = 0; i < prefs.length; i++) { if (MR.isTypeSupported(prefs[i][0])) { recMime = prefs[i][0]; recExt = prefs[i][1]; return; } }
      recMime = ""; recExt = "webm";
    }

    // ── views ─────────────────────────────────────────────────────────────
    // NB: do NOT revoke here — renderPreview/renderDownloadFallback build the html
    // with a freshly-created blob URL and revoking it before load would break the
    // <video>/<a download>. Blob URLs are freed only when LEAVING a blob screen
    // (startRealize / renderDownloadFallback / markDoneAndThank).
    function view(html) { document.body.classList.remove("defi-recording", "defi-camera"); root.innerHTML = html; }

    function renderLoading() { view('<div class="suite-auth-spinner" style="margin:0 auto"></div><p class="defi-sub">' + esc(t("defiLoading")) + '</p>'); }

    function renderError(msg) {

        '<a class="suite-btn suite-btn-ghost" href="./welcome.html">🏠 ' + esc(t("navHome")) + '</a>');
    }

    function metaChips(s) {
      var out = "";
      if (s.category) out += '<span class="defi-chip">🏷 ' + esc(s.category) + '</span>';
      if (s.theme) out += '<span class="defi-chip">🎭 ' + esc(s.theme) + '</span>';
      if (durSec()) out += '<span class="defi-chip">⏱ ' + esc(fmtSec(durSec())) + '</span>';
      if (s.players) out += '<span class="defi-chip">👥 ' + esc(s.players) + '</span>';
      if (s.nature) out += '<span class="defi-chip">🎲 ' + esc(s.nature) + '</span>';
      return out ? '<div class="defi-meta">' + out + '</div>' : "";
    }

    // NO SPOILER: the épreuve (title / catégorie / thème) is revealed ONLY by the
    // in-video announce. Before that, the recipient sees just the practical facts:
    // how many improvisers and how long.
    /* Ce qui reste secret dépend du défi : contrainte ET thème, contrainte seule
       (« Le téléachat de l'absurde »), ou thème seul. Le caucus annoncé est celui
       choisi à l'envoi : le texte promettait toujours 20 s, même sans caucus. */
    function mysteryText() {
      var s = (data && data.snapshot) || {};
      var cle = (s.category && s.theme) ? "defiMysteryBoth" : s.theme ? "defiMysteryTheme" : "defiMysteryGame";
      var cs = caucusSec();
      return t(cle) + " " + (cs > 0
        ? tf("defiMysteryTiming", { announce: ANNOUNCE_SEC, caucus: cs })
        : tf("defiMysteryTimingNoCaucus", { announce: ANNOUNCE_SEC }));
    }
    function mysteryCard() {
      var chips = "";
      if (playersN()) chips += '<span class="defi-chip">👥 ' + esc(tf("defiPlayersChip", { n: playersN() })) + '</span>';
      if (durSec()) chips += '<span class="defi-chip">⏱ ' + esc(fmtSec(durSec())) + '</span>';

    }

    function renderWelcome() {
      var done = data.status === "done";
      view('<div class="defi-kicker">🎬 ' + esc(t("defiTitle")) + '</div>' +
        '<h1 class="defi-title">' + esc(tf("defiFrom", { name: data.sender_name || "Acto" })) + '</h1>' +
        mysteryCard() +
        (data.message ? '<div class="defi-msg">« ' + esc(data.message) + ' »</div>' : "") +
        (done ? '<p class="defi-sub">✅ ' + esc(t("defiAlreadyDone")) + '</p>' : "") +
        '<button type="button" class="suite-btn suite-btn-primary" data-act="go">🎥 ' + esc(t("defiStart")) + '</button>' +
        '<p class="defi-note">' + esc(t("defiPrivacyShort")) + '</p>');
      root.querySelector('[data-act="go"]').onclick = renderConsent;

    function renderConsent() {
      view('<div class="defi-kicker">🎁 ' + esc(t("defiTitle")) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiConsentTitle")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiConsentBody")) + '</p>' +
        '<p class="defi-note">🔒 ' + esc(t("defiKeepOrientHint")) + '</p>' +
        '<div class="defi-actions solo">' +
          '<button type="button" class="suite-btn suite-btn-primary" data-act="start">🎥 ' + esc(t("defiConsentBtn")) + '</button>' +
        '</div>' +
        '<button type="button" class="suite-btn suite-btn-ghost" data-act="back">‹ ' + esc(t("commonBack") || "Retour") + '</button>');
      root.querySelector('[data-act="start"]').onclick = function () {
        tryImmersive();   // fullscreen + orientation lock — must run inside the click gesture
        startRealize();
      };
      root.querySelector('[data-act="back"]').onclick = renderWelcome;
    }

    function renderCamError() {
      stopStream();   // guarantee the camera/mic are released on every error path
      recActive = false; releaseImmersive();
      view('<div class="defi-kicker">🎁 ' + esc(t("defiTitle")) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiCamDenied")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiCamDeniedSub")) + '</p>' +
        '<button type="button" class="suite-btn suite-btn-primary" data-act="retry">↻ ' + esc(t("defiCamRetry")) + '</button>');
      // Retry is a real click gesture → re-enter fullscreen + orientation lock too.
      root.querySelector('[data-act="retry"]').onclick = function () { tryImmersive(); startRealize(); };
    }

    function startRealize() {
      revoke(); stopStream();   // free a prior preview blob + any leftover stream (Refaire / retry)
      clearTimer();             // a redo must never inherit a live sequence timer
      if (preTk) { clearInterval(preTk); preTk = null; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { renderCamError(); return; }
      ensureAudio();            // DANS le clic : plus tard, iOS refuserait de démarrer le son
      renderLoading();
      // La dernière caméra choisie si elle est encore branchée, sinon la frontale.
      var memo = ""; try { memo = localStorage.getItem(CAM_KEY) || ""; } catch (e) {}
      function obtenu(st) {
        stream = st;
        prepareCompositor();   // camVideo + canvas sizing settle during the setup screen
        brancherFlux(st);
        listerCameras().then(function () { renderSetup(); });
      }
      navigator.mediaDevices.getUserMedia({ video: contraintesVideo(memo ? { deviceId: { exact: memo } } : { facingMode: "user" }), audio: true }).then(obtenu, function () {
        if (!memo) { renderCamError(); return; }
        // Caméra mémorisée débranchée : on l'oublie et on repart de la frontale.
        try { localStorage.removeItem(CAM_KEY); } catch (e) {}
        navigator.mediaDevices.getUserMedia({ video: contraintesVideo({ facingMode: "user" }), audio: true }).then(obtenu, function () { renderCamError(); });
      });
    }

    /* Format du FICHIER, celui des réseaux sociaux et non celui du capteur :
       portrait → 720×1280 (9:16 : Reels Instagram et Facebook, TikTok, Shorts,
       vidéo verticale LinkedIn) ; paysage → 1280×720 (16:9). Avant, le canvas
       reprenait les proportions de la caméra : du 3:4 sur la plupart des
       téléphones, du 640×480 sur une webcam — bordé de noir ou recadré au hasard
       à la publication. L'image est recadrée au centre (drawCover), jamais
       déformée. 720p : accepté partout, et tenable à 30 i/s sur un téléphone, où
       chaque image est redessinée puis encodée. */
    var FORMAT_PORTRAIT = [720, 1280], FORMAT_PAYSAGE = [1280, 720];
    function formatDe(v) {
      var vw = v && v.videoWidth, vh = v && v.videoHeight;
      var portrait = (vw && vh) ? vh > vw : innerHeight > innerWidth;
      return portrait ? FORMAT_PORTRAIT : FORMAT_PAYSAGE;
    }
    function appliquerFormat() {
      if (!canvas || recActive) return;   // jamais pendant l'enregistrement : dimensions figées
      var f = formatDe(camVideo);
      if (canvas.width !== f[0] || canvas.height !== f[1]) { canvas.width = f[0]; canvas.height = f[1]; }
    }
    // Aperçu (réglages, 3-2-1) au format du fichier : il suit l'orientation du flux.
    function suivreFormat(v) {
      function maj() {
        var cadre = v.parentNode; if (!cadre || !cadre.classList) return;
        cadre.classList.toggle("is-paysage", formatDe(v) === FORMAT_PAYSAGE);
      }
      v.addEventListener("loadedmetadata", maj); v.addEventListener("resize", maj); maj();
    }
    // 720p demandé sans l'exiger : sans indication, Chrome ouvre une webcam en
    // 640×480, une image floue qu'il faudrait agrandir pour remplir le cadre.
    function contraintesVideo(base) {
      var c = { width: { ideal: 1280 }, height: { ideal: 720 } };
      for (var k in base) c[k] = base[k];
      return c;
    }

    // Camera → hidden <video> → sized <canvas>. Done BEFORE recording starts so the
    // canvas dimensions are locked when MediaRecorder attaches (a mid-record resize
    // corrupts the capture stream in several browsers).
    function prepareCompositor() {
      camVideo = document.createElement("video");
      camVideo.muted = true; camVideo.setAttribute("playsinline", ""); camVideo.setAttribute("autoplay", "");
      try { camVideo.srcObject = stream; } catch (e) {}
      try { var pp = camVideo.play(); if (pp && pp.catch) pp.catch(function () {}); } catch (e) {}
      canvas = document.createElement("canvas"); cctx = canvas.getContext("2d");
      appliquerFormat();
      camVideo.addEventListener("loadedmetadata", appliquerFormat);
      camVideo.addEventListener("resize", appliquerFormat);   // téléphone tourné pendant les réglages
    }

    /* Écran de réglage, entre l'autorisation et le décompte. Avant, le compte à
       rebours partait dès l'autorisation : trois secondes pour se cadrer, sans
       pouvoir changer de caméra ni se voir en miroir, et sans savoir si le micro
       captait quoi que ce soit. */
    // Croix posée en haut à gauche de l'image caméra (réglages, puis 3-2-1).
    function croixFermer() {
      return '<button type="button" class="defi-cam-close" data-act="cancel" aria-label="' + esc(t("commonClose")) + '" title="' + esc(t("commonClose")) + '">✕</button>';
    }

    function renderSetup() {
      var opts = "", cur = reglagesPiste().deviceId || "";
      camDevices.forEach(function (d, i) {
        opts += '<option value="' + esc(d.deviceId) + '"' + (d.deviceId === cur ? " selected" : "") + '>' +
          esc(d.label || tf("defiCamN", { n: i + 1 })) + '</option>';
      });
      view('<div class="defi-kicker">🎬 ' + esc(t("defiGetReady")) + '</div>' +
        // Les commandes sont posées SUR l'image : sous la vidéo, « C'est parti »
        // tombait hors de l'écran sur téléphone (une caméra portrait y fait
        // ~600 px de haut). La vidéo est ajoutée dans ce cadre juste après.
        '<div class="defi-stage"><div class="defi-cam-frame" id="defiStage">' + croixFermer() +
          '<button type="button" class="suite-btn suite-btn-primary defi-cam-go" data-act="ready">🎬 ' + esc(t("defiReady")) + '</button>' +
        '</div></div>' +
        '<div class="defi-setup">' +
          (camDevices.length > 1
            ? '<label class="defi-setup-row"><span>' + esc(t("defiCamLabel")) + '</span>' +
                '<select class="suite-input defi-cam-select" data-act="cam">' + opts + '</select></label>'
            : '') +
          '<button type="button" class="suite-btn suite-btn-ghost defi-mirror-btn" data-act="mirror"></button>' +
          '<div class="defi-meter" role="meter" aria-label="' + esc(t("defiMicLevel")) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="defiMeterBar"></span></div>' +
          '<p class="defi-note">🎙 ' + esc(t("defiMicHint")) + '</p>' +
          '<p class="defi-note defi-filmed">🔴 ' + esc(caucusSec() > 0 ? t("defiFilmedWithCaucus") : t("defiFilmed")) + '</p>' +
        '</div>');
      var v = document.createElement("video"); v.id = "defiSetupVideo"; v.className = "defi-video"; v.muted = true;
      v.setAttribute("playsinline", ""); v.setAttribute("autoplay", "");
      try { v.srcObject = stream; } catch (e) {}
      document.getElementById("defiStage").appendChild(v);
      suivreFormat(v);
      document.body.classList.add("defi-camera");   // pied de page masqué pendant les réglages

      var btnMiroir = root.querySelector('[data-act="mirror"]');
      function peindreMiroir() {
        v.classList.toggle("is-mirror", mirror);
        btnMiroir.textContent = "↔ " + t(mirror ? "defiMirrorOn" : "defiMirrorOff");
        btnMiroir.setAttribute("aria-pressed", mirror ? "true" : "false");
      }
      peindreMiroir();
      btnMiroir.onclick = function () {
        mirror = !mirror;
        var prefs = lirePref(MIRROR_KEY) || {};
        prefs[camFacing === "environment" ? "environment" : "user"] = mirror;
        ecrirePref(MIRROR_KEY, prefs);
        peindreMiroir();
      };

      var sel = root.querySelector('[data-act="cam"]');
      if (sel) sel.onchange = function () {
        sel.disabled = true;
        changerCamera(sel.value).then(function (reussi) {
          sel.disabled = false;
          if (!reussi) sel.value = reglagesPiste().deviceId || sel.value;
          peindreMiroir();          // la nouvelle caméra apporte sa propre préférence de miroir
        }, function () { sel.disabled = false; renderCamError(); });
      };

      // Vu-mètre : la seule façon de savoir AVANT de filmer que le micro capte.
      var ech = new Uint8Array(512), barre = document.getElementById("defiMeterBar"), jauge = root.querySelector(".defi-meter");
      function mesurer() {
        if (!barre || !barre.isConnected) { meterRaf = 0; return; }
        var niveau = 0;
        if (micMeter) {
          micMeter.getByteTimeDomainData(ech);
          var somme = 0; for (var i = 0; i < ech.length; i++) { var x = (ech[i] - 128) / 128; somme += x * x; }
          niveau = Math.min(100, Math.round(Math.sqrt(somme / ech.length) * 300));
        }
        barre.style.width = niveau + "%";
        if (jauge) jauge.setAttribute("aria-valuenow", String(niveau));
        meterRaf = requestAnimationFrame(mesurer);
      }
      if (meterRaf) cancelAnimationFrame(meterRaf);
      meterRaf = requestAnimationFrame(mesurer);

      root.querySelector('[data-act="cancel"]').onclick = function () { stopStream(); releaseImmersive(); renderWelcome(); };
      root.querySelector('[data-act="ready"]').onclick = function () {
        ensureAudio();   // nouveau geste : le son a pu être suspendu entre-temps
        if (meterRaf) { cancelAnimationFrame(meterRaf); meterRaf = 0; }
        renderPreRoll();
      };
    }

    // 3-2-1 pre-roll: camera live, NOT recording yet — time to get in position.

      }

      // ── announce / caucus: top band PHASE (left) + chrono (right) ─────
      /* Le voile qui assombrit la caméra passe EN PREMIER. Il était peint dans les
         blocs annonce et caucus plus bas, donc APRÈS le bandeau et les pastilles :
         « ANNONCE », « CAUCUS », le chrono et les pastilles sortaient ternis de
         moitié, d'un or grisé peu lisible. */
      g.fillStyle = phase === "announce" ? "rgba(6,4,12,0.5)" : "rgba(6,4,12,0.45)";
      g.fillRect(0, 0, w, h);
      // Tailles reprises par placerIndicateurs() : bandeau 17u, libellé 4,2u, chrono 9u.
      var topH = 17 * u;
      var grd = g.createLinearGradient(0, 0, 0, topH);
      grd.addColorStop(0, "rgba(6,4,12,0.9)"); grd.addColorStop(1, "rgba(6,4,12,0)");
      g.fillStyle = grd; g.fillRect(0, 0, w, topH);
      g.textBaseline = "top"; g.textAlign = "left";
      // Le nom de la phase reste dans la vidéo — il informe le spectateur. Le point
      // rouge et « REC », eux, n'informent que l'improvisateur : ils sont passés à
      // l'écran seul, pour ne jamais apparaître dans le fichier.
      g.save();
      g.shadowColor = "rgba(0,0,0,0.75)"; g.shadowBlur = 0.8 * u;   // lisible même sur une image claire
      g.fillStyle = "#f4d06a"; g.font = FI(700, 4.2 * u);
      g.fillText(phaseLabel().toUpperCase(), pad, pad + 0.9 * u);
      g.textAlign = "right"; g.font = FB(9 * u);
      g.fillText(num, w - pad, pad - 0.8 * u);
      g.restore();
      g.textAlign = "left";

      // ── bottom band: info chips ─────────────────────────────────────────
      var botH = 12 * u;
      var grd2 = g.createLinearGradient(0, h - botH, 0, h);
      grd2.addColorStop(0, "rgba(6,4,12,0)"); grd2.addColorStop(1, "rgba(6,4,12,0.85)");
      g.fillStyle = grd2; g.fillRect(0, h - botH, w, botH);
      drawChips(g, infoChips(s), w, h - 5.4 * u, u);

      // ── announce: the REVEAL — category + explanation + theme, centered ─
      if (phase === "announce") {
        /* Le thème est ce que les jouteurs doivent retenir : il n'est plus tronqué
           à 4 lignes. Mise en page calculée une fois par format : mepAnnonce(). */
        var A = mepAnnonce(g, w, h, s, u, landscape);
        var pw = A.pw, px = (w - pw) / 2, ph2 = A.ph2, py = (h - ph2) / 2;
        var titleLines = A.titleLines, descLines = A.descLines, themeLines = A.themeLines;
        var descPx = A.descPx, themePx = A.themePx, lhT = 10 * u, lhD = descPx * 1.35, lhTh = themePx * 1.28;

        g.fillStyle = "rgba(8,5,16,0.82)"; rrect(g, px, py, pw, ph2, 3 * u); g.fill();
        g.strokeStyle = "rgba(232,199,102,0.5)"; g.lineWidth = Math.max(1, 0.28 * u); g.stroke();

        var y = py + 5 * u; g.textAlign = "center";
        g.fillStyle = "#e8c766"; g.font = FI(700, 2.8 * u);
        g.fillText(t("defiCategoryLabel").toUpperCase(), w / 2, y); y += 5 * u;
        g.fillStyle = "#f4d06a"; g.font = FB(9.5 * u);
        for (var i = 0; i < titleLines.length; i++) { g.fillText(titleLines[i], w / 2, y); y += lhT; }
        if (descLines.length) {
          y += 1 * u;
          g.fillStyle = "rgba(244,240,230,0.92)"; g.font = FI(400, descPx);
          for (var j = 0; j < descLines.length; j++) { g.fillText(descLines[j], w / 2, y); y += lhD; }
        }
        if (themeLines.length) {
          y += 2 * u;
          g.fillStyle = "#e8c766"; g.font = FI(700, 2.8 * u);
          g.fillText(t("defiThemeLabel").toUpperCase(), w / 2, y); y += 4.2 * u;
          g.fillStyle = "#ffffff"; g.font = FI(600, themePx);
          for (var k = 0; k < themeLines.length; k++) { g.fillText(themeLines[k], w / 2, y); y += lhTh; }
        }
        g.textAlign = "left";
      }

      // ── caucus: big centered countdown + gentle hint ────────────────────
      if (phase === "caucus") {
        g.textAlign = "center";
        g.fillStyle = "#e8c766"; g.font = FI(700, 3.2 * u);
        g.fillText(t("defiPhaseCaucus").toUpperCase(), w / 2, h / 2 - 17 * u);
        g.fillStyle = "#f4d06a"; g.font = FB(24 * u); g.textBaseline = "middle";
        g.fillText(num, w / 2, h / 2 + 1 * u);
        g.textBaseline = "top";
        g.fillStyle = "rgba(244,240,230,0.85)"; g.font = FI(500, 3.2 * u);
        g.fillText(t("defiCaucusHint"), w / 2, h / 2 + 13 * u);
        g.textAlign = "left";
      }
    }

    /* Indicateurs d'écran placés d'après l'image RÉELLEMENT affichée. Le canvas
       est en object-fit: contain : selon l'écran et le format, l'image touche les
       bords ou laisse des bandes noires. Posés à des coordonnées d'écran fixes, le
       point REC recouvrait le chrono et « le caucus est filmé » butait contre
       « ANNONCE » dès que l'image remplissait l'écran (paysage). */
    function rectImage() {
      var r = canvas.getBoundingClientRect(), sc = Math.min(r.width / canvas.width, r.height / canvas.height);
      var iw = canvas.width * sc, ih = canvas.height * sc;
      return { x: r.left + (r.width - iw) / 2, y: r.top + (r.height - ih) / 2, w: iw, h: ih, sc: sc };
    }
    function placerIndicateurs() {
      var dot = root.querySelector(".defi-rec-dot"), note = document.getElementById("defiCaucusNote");
      if (!dot || !usingCanvas || !canvas || !cctx) return;
      var im = rectImage(); if (!(im.w > 0 && im.h > 0)) return;
      var u = Math.min(canvas.width, canvas.height) / 100, s = im.sc, pad = 4 * u, marge = 8;
      // REC : à sa place, en haut à droite, s'il tient dans une bande noire ;
      // sinon juste sous le chrono — toujours en haut à droite, jamais dessus.
      dot.style.top = ""; dot.style.right = "";
      var rd = dot.getBoundingClientRect(), deplace = false;
      if (!(rd.bottom + marge <= im.y || rd.left - marge >= im.x + im.w)) {
        dot.style.top = Math.round(im.y + (pad + 8 * u) * s + marge) + "px";
        dot.style.right = Math.round(innerWidth - (im.x + im.w) + pad * s) + "px";
        deplace = true;
      }
      // ⓘ : en bas à gauche, dans une bande noire s'il y tient ; sinon relevé
      // au-dessus des pastilles d'info (annonce, caucus), qu'il recouvrait.
      var info = root.querySelector('[data-act="info"]');
      if (info && !info.hidden) {
        info.style.bottom = "";
        var ri = info.getBoundingClientRect();
        if (!(ri.top - marge >= im.y + im.h || ri.right + marge <= im.x)) {
          info.style.bottom = Math.round(innerHeight - (im.y + (canvas.height - 9 * u) * s) + marge) + "px";
        }
      }
      // « Le caucus est filmé » : dans la rangée du bandeau s'il y tient entre le
      // nom de la phase et le chrono, sinon sous le bandeau (et sous le REC).
      if (note && !note.hidden) {
        note.style.top = "";
        var nw = note.offsetWidth, nh = note.offsetHeight;
        cctx.save();
        cctx.font = FI(700, 4.2 * u); var lw = cctx.measureText(phaseLabel().toUpperCase()).width * s;
        cctx.font = FB(9 * u); var cw = cctx.measureText("0:00").width * s;
        cctx.restore();
        if (im.w / 2 - nw / 2 >= pad * s + Math.max(lw, cw) + 16) {
          note.style.top = Math.round(im.y + (pad + 3 * u) * s - nh / 2) + "px";
        } else {
          var sous = im.y + 17 * u * s + marge;
          if (deplace) sous = Math.max(sous, dot.getBoundingClientRect().bottom + marge);
          note.style.top = Math.round(sous) + "px";
        }
      }
    }

    function stopRecording() {
      clearTimer();
      recActive = false; startLandscape = null;
      releaseImmersive();
      try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) {}
      stopStream();   // release the camera/mic as soon as we stop
    }

    /* Fenêtre ⓘ : la description de la contrainte ou de l'exercice, relisible à
       tout moment une fois l'épreuve révélée — la carte d'annonce ne reste que
       10 secondes, et coupe une description trop longue. Du HTML posé sur
       l'écran : elle n'apparaît jamais dans la vidéo. Jamais proposée AVANT la
       révélation non plus, pour ne rien divulgâcher. */
    function aDeLInfo() { var s = (data && data.snapshot) || {}; return !!String(s.subtitle || "").trim(); }
    function ouvrirInfo() {
      var deja = document.getElementById("defiInfoPop"); if (deja) { deja.remove(); return; }
      var s = (data && data.snapshot) || {};
      var pop = document.createElement("div");
      pop.id = "defiInfoPop"; pop.className = "defi-info-pop";
      pop.setAttribute("role", "dialog"); pop.setAttribute("aria-modal", "true"); pop.setAttribute("aria-label", t("defiInfoBtn"));
      pop.innerHTML = '<div class="defi-info-card">' +
        '<div class="defi-kicker">' + esc(t("defiCategoryLabel")) + '</div>' +
        '<h2 class="defi-card-title">' + esc(s.category || s.title || "") + '</h2>' +
        (s.subtitle ? '<p class="defi-info-desc">' + esc(s.subtitle) + '</p>' : '') +
        (s.theme ? '<div class="defi-kicker">' + esc(t("defiThemeLabel")) + '</div><p class="defi-info-theme">' + esc(s.theme) + '</p>' : '') +
        '<button type="button" class="suite-btn suite-btn-primary" data-act="info-close">' + esc(t("commonClose")) + '</button>' +
      '</div>';
      (document.getElementById("defiRec") || document.body).appendChild(pop);
      function fermer() { pop.remove(); }
      pop.addEventListener("click", function (e) {
        if (e.target === pop || (e.target.getAttribute && e.target.getAttribute("data-act") === "info-close")) fermer();
      });
      pop.addEventListener("keydown", function (e) { if (e.key === "Escape") fermer(); });
      try { pop.querySelector('[data-act="info-close"]').focus(); } catch (e) {}
    }

    function renderPreview() {
      revoke();
      blobUrl = URL.createObjectURL(blob);
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiPreviewTitle")) + '</h1>' +
        '<video class="defi-video is-preview" src="' + blobUrl + '" controls playsinline></video>' +
        '<div class="defi-actions">' +
          '<button type="button" class="suite-btn suite-btn-ghost" data-act="redo">↻ ' + esc(t("defiRedo")) + '</button>' +
          '<button type="button" class="suite-btn suite-btn-primary" data-act="send">📤 ' + esc(t("defiSend")) + '</button>' +
        '</div>' +
        '<p class="defi-note">' + esc(t("defiPrivacyShort")) + '</p>');
      // Redo is a real click gesture → the retake gets the same lock as the first take.
      root.querySelector('[data-act="redo"]').onclick = function () { tryImmersive(); startRealize(); };
      root.querySelector('[data-act="send"]').onclick = doSend;
    }

    function fileName() { return "defi-" + slug(epTitle()) + "." + recExt; }

    function doSend() {
      if (!blob) return;
      var file = null;
      try { file = new File([blob], fileName(), { type: blob.type || recMime || "video/webm" }); } catch (e) { file = null; }
      var shareData = file ? { files: [file], title: epTitle(), text: tf("defiShareText", { title: epTitle() }) } : null;
      var canShareFiles = !!(file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share);
      if (canShareFiles) {
        navigator.share(shareData).then(markDoneAndThank, function (err) {
          // Only a genuine user-cancel (AbortError) stays on preview. Any other
          // rejection (NotAllowedError, etc.) falls through to the download so the
          // recipient always has a working, on-device delivery path.
          if (err && err.name === "AbortError") return;
          renderDownloadFallback();
        });
      } else {
        renderDownloadFallback();
      }
    }

    function renderDownloadFallback() {
      revoke(); blobUrl = URL.createObjectURL(blob);
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiSend")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiDownloadHint")) + '</p>' +
        '<video class="defi-video is-preview" src="' + blobUrl + '" controls playsinline></video>' +
        '<div class="defi-actions solo">' +
          '<a class="suite-btn suite-btn-primary" id="defiDl" href="' + blobUrl + '" download="' + esc(fileName()) + '">⬇ ' + esc(t("defiDownload")) + '</a>' +
        '</div>');
      var dl = document.getElementById("defiDl");
      if (dl) dl.addEventListener("click", function () { setTimeout(markDoneAndThank, 400); });
    }

    function markDoneAndThank() {
      if (sb && TOKEN) { try { sb.rpc("mark_challenge_done", { p_token: TOKEN }); } catch (e) {} }
      revoke();
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">🎉 ' + esc(t("defiSharedTitle")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiSharedSub")) + '</p>' +
        '<a class="suite-btn suite-btn-ghost" href="./welcome.html">🏠 ' + esc(t("navHome")) + '</a>');
    }

    // ── boot ────────────────────────────────────────────────────────────
    function boot() {
      if (!TOKEN) { renderError(); return; }
      if (!sb) { renderError(t("defiNotFoundSub")); return; }
      renderLoading();
      Promise.resolve(sb.rpc("get_challenge_by_token", { p_token: TOKEN })).then(function (res) {
        var row = res && res.data && res.data[0];
        if (res && res.error) { renderError(); return; }
        if (!row) { renderError(); return; }
        data = row;
        try { sb.rpc("mark_challenge_opened", { p_token: TOKEN }); } catch (e) {}
        renderWelcome();
      }, function () { renderError(); });
    }

    window.addEventListener("pagehide", function () {
      clearTimer();
      if (preTk) { clearInterval(preTk); preTk = null; }   // a bfcache restore must not resume the pre-roll
      recActive = false; startLandscape = null;
      try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) {}
      stopStream();
    });
    if (S && S.applyLocale) { try { S.applyLocale(); } catch (e) {} }

    // Pied de page « Créer un défi » : libellé dans la langue de la personne.
    function peindrePied() {
      var lab = document.getElementById("defiCreateLabel"); if (lab) lab.textContent = t("defiCreateOwn");
    }
    peindrePied();
    // La langue de la personne arrive après coup (locale-loader) : on repeint alors.
    if (window.actoLocaleReady && window.actoLocaleReady.then) window.actoLocaleReady.then(peindrePied, peindrePied);
    if (S && S.onLocaleChange) S.onLocaleChange(peindrePied);
    // Une prise pas encore envoyée n'existe qu'en mémoire : le lien s'ouvre alors
    // dans un nouvel onglet, pour ne pas la perdre.
    var lienCreer = document.getElementById("defiCreateLink");
    if (lienCreer) lienCreer.addEventListener("click", function () {
      if (root.querySelector('[data-act="send"], #defiDl')) { lienCreer.target = "_blank"; lienCreer.rel = "noopener"; }
      else lienCreer.removeAttribute("target");
    });

    boot();
  })();
  </script>
</body>
