<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0814" />
<title>Acto — Défi à relever</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260716" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20260716" />
<link rel="stylesheet" href="suite.css?v=20260716" />
<style>
  .defi-body { min-height: 100svh; }
  .defi-wrap { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; padding: 1.4rem 1.05rem; text-align: center; }
  .defi-logo { width: 56px; height: auto; opacity: 0.9; }
  #defiRoot { width: 100%; max-width: 34rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .defi-kicker { font: 700 0.78rem/1 "Inter", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-soft); }
  .defi-title { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.7rem, 6vw, 2.6rem); letter-spacing: 1px; margin: 0; color: var(--ink); line-height: 1.05; }
  .defi-sub { color: var(--ink-muted); margin: 0; max-width: 30rem; line-height: 1.5; }
  .defi-from { color: var(--ink); font-weight: 600; }
  .defi-card { width: 100%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); border-radius: 18px; padding: 1.1rem 1.15rem; display: flex; flex-direction: column; gap: 0.6rem; text-align: left; }
  .defi-card-title { font-family: "Playfair Display", serif; font-size: 1.35rem; color: var(--gold); margin: 0; line-height: 1.2; }
  .defi-card-desc { color: var(--ink-muted); margin: 0; line-height: 1.5; }
  .defi-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .defi-chip { display: inline-flex; align-items: center; gap: 0.3rem; font: 600 0.82rem/1 "Inter", sans-serif; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 0.35rem 0.6rem; }
  .defi-msg { width: 100%; border-left: 3px solid var(--gold-soft); background: rgba(212,175,55,0.06); border-radius: 0 12px 12px 0; padding: 0.7rem 0.9rem; color: var(--ink-muted); font-style: italic; text-align: left; }
  .defi-clock { font-family: "Bebas Neue", monospace; font-size: clamp(3rem, 15vw, 5rem); color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
  .defi-clock.is-low { color: #ef6b6b; }
  .defi-video { width: 100%; max-width: 30rem; aspect-ratio: 3/4; background: #000; border-radius: 16px; object-fit: cover; border: 1px solid rgba(255,255,255,0.12); }
  .defi-video.is-preview { aspect-ratio: auto; max-height: 60svh; }
  .defi-badge-rec { display: inline-flex; align-items: center; gap: 0.4rem; color: #ef6b6b; font: 700 0.9rem/1 "Inter", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  .defi-badge-rec::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: #ef6b6b; animation: defiBlink 1s steps(2, start) infinite; }
  @keyframes defiBlink { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .defi-badge-rec::before { animation: none; } }
  .defi-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; width: 100%; }
  .defi-actions .suite-btn { flex: 1 1 auto; min-width: 9rem; }
  .defi-actions.solo .suite-btn { flex: 0 1 auto; }
  .defi-note { font-size: 0.82rem; color: var(--ink-faint); max-width: 28rem; }
  .defi-received { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
  .defi-received-row { display: flex; align-items: center; gap: 0.7rem; text-align: left; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); border-radius: 12px; padding: 0.6rem 0.8rem; }
  /* Landscape phone: keep the whole flow visible without a lot of scroll. */
  @media (orientation: landscape) and (max-height: 460px) {
    .defi-wrap { justify-content: flex-start; gap: 0.7rem; padding: 0.8rem 1rem; }
    .defi-video { aspect-ratio: 16/10; max-height: 52svh; }
    .defi-clock { font-size: clamp(2.2rem, 10vh, 3.4rem); }
  }
</style>
</head>
<body class="suite-body defi-body">
  <div class="defi-wrap">
    <img class="defi-logo" src="./assets/logo.png?v=20260716" alt="Acto" />
    <div id="defiRoot"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"
          integrity="sha384-8ljL080xacUYrqBXUJRcP68fd1dVCh9qK/xi9QMzxUgOVNycXp0s6mBZAjBMp9W0"
          crossorigin="anonymous"></script>
  <script src="./js/config.js?v=20260716"></script>
  <script src="./data/all.js?v=20260716"></script>
  <script src="./js/suite/i18n.js?v=20260716"></script>
  <script src="./js/suite/core.js?v=20260716"></script>
  <script>
  (function () {
    "use strict";
    var S = window.ActoSuite;
    function t(k) { return S ? S.t(k) : k; }
    function tf(k, v) { return S ? S.tf(k, v) : k; }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function fmtSec(s) { return S ? S.formatSec(s) : (s + "s"); }

    try {
      var CFG = window.actoConfig.supabase;
      window.actoSuiteSb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    } catch (e) { /* ignore */ }
    var sb = window.actoSuiteSb;

    var root = document.getElementById("defiRoot");
    var params = new URLSearchParams(location.search);
    var TOKEN = (params.get("token") || "").trim();

    // ── recording state ──────────────────────────────────────────────────
    var data = null;                 // {sender_name,message,status,snapshot,created_at}
    var stream = null, recorder = null, chunks = [], recMime = "", recExt = "webm";
    var blob = null, blobUrl = null;
    var tk = null, tEnd = 0, tDur = 0;

    function durSec() { var d = data && data.snapshot ? parseInt(data.snapshot.durationSec, 10) : 0; return (d > 0 && d < 3600) ? d : 0; }
    function epTitle() { return (data && data.snapshot && data.snapshot.title) || t("defiTitle"); }

    // ── helpers ─────────────────────────────────────────────────────────
    function clearTimer() { if (tk) { clearInterval(tk); tk = null; } }
    function stopStream() { try { if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} stream = null; }
    function revoke() { if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = null; } }
    function slug(s) { return String(s || "defi").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "defi"; }

    function pickMime() {
      var MR = window.MediaRecorder;
      if (!MR || !MR.isTypeSupported) { recMime = ""; recExt = "webm"; return; }
      // Prefer mp4 (widely accepted by share targets / iOS); fall back to webm.
      var prefs = [["video/mp4", "mp4"], ["video/webm;codecs=vp9,opus", "webm"], ["video/webm;codecs=vp8,opus", "webm"], ["video/webm", "webm"]];
      for (var i = 0; i < prefs.length; i++) { if (MR.isTypeSupported(prefs[i][0])) { recMime = prefs[i][0]; recExt = prefs[i][1]; return; } }
      recMime = ""; recExt = "webm";
    }

    // ── views ─────────────────────────────────────────────────────────────
    // NB: do NOT revoke here — renderPreview/renderDownloadFallback build the html
    // with a freshly-created blob URL and revoking it before load would break the
    // <video>/<a download>. Blob URLs are freed only when LEAVING a blob screen
    // (startRealize / renderDownloadFallback / markDoneAndThank).
    function view(html) { root.innerHTML = html; }

    function renderLoading() { view('<div class="suite-auth-spinner" style="margin:0 auto"></div><p class="defi-sub">' + esc(t("defiLoading")) + '</p>'); }

    function renderError(msg) {
      view('<div class="defi-kicker">🎬 ' + esc(t("defiTitle")) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiNotFound")) + '</h1>' +
        '<p class="defi-sub">' + esc(msg || t("defiNotFoundSub")) + '</p>' +
        '<a class="suite-btn suite-btn-ghost" href="./welcome.html">🏠 ' + esc(t("navHome")) + '</a>');
    }

    function metaChips(s) {
      var out = "";
      if (s.category) out += '<span class="defi-chip">🏷 ' + esc(s.category) + '</span>';
      if (s.theme) out += '<span class="defi-chip">🎭 ' + esc(s.theme) + '</span>';
      if (durSec()) out += '<span class="defi-chip">⏱ ' + esc(fmtSec(durSec())) + '</span>';
      if (s.players) out += '<span class="defi-chip">👥 ' + esc(s.players) + '</span>';
      if (s.nature) out += '<span class="defi-chip">🎲 ' + esc(s.nature) + '</span>';
      return out ? '<div class="defi-meta">' + out + '</div>' : "";
    }

    function epreuveCard(s) {
      return '<div class="defi-card">' +
        '<h2 class="defi-card-title">' + esc(s.title || t("defiTitle")) + '</h2>' +
        (s.subtitle ? '<p class="defi-card-desc">' + esc(s.subtitle) + '</p>' : "") +
        metaChips(s) +
      '</div>';
    }

    function renderWelcome() {
      var s = data.snapshot || {};
      var done = data.status === "done";
      view('<div class="defi-kicker">🎬 ' + esc(t("defiTitle")) + '</div>' +
        '<h1 class="defi-title">' + esc(tf("defiFrom", { name: data.sender_name || "Acto" })) + '</h1>' +
        epreuveCard(s) +
        (data.message ? '<div class="defi-msg">« ' + esc(data.message) + ' »</div>' : "") +
        (done ? '<p class="defi-sub">✅ ' + esc(t("defiAlreadyDone")) + '</p>' : "") +
        '<button type="button" class="suite-btn suite-btn-primary" data-act="go">🎥 ' + esc(t("defiStart")) + '</button>' +
        '<p class="defi-note">' + esc(t("defiPrivacyShort")) + '</p>');
      root.querySelector('[data-act="go"]').onclick = renderConsent;
    }

    function renderConsent() {
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiConsentTitle")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiConsentBody")) + '</p>' +
        '<div class="defi-actions solo">' +
          '<button type="button" class="suite-btn suite-btn-primary" data-act="start">🎥 ' + esc(t("defiConsentBtn")) + '</button>' +
        '</div>' +
        '<button type="button" class="suite-btn suite-btn-ghost" data-act="back">‹ ' + esc(t("commonBack") || "Retour") + '</button>');
      root.querySelector('[data-act="start"]').onclick = startRealize;
      root.querySelector('[data-act="back"]').onclick = renderWelcome;
    }

    function renderCamError() {
      stopStream();   // guarantee the camera/mic are released on every error path
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiCamDenied")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiCamDeniedSub")) + '</p>' +
        '<button type="button" class="suite-btn suite-btn-primary" data-act="retry">↻ ' + esc(t("defiCamRetry")) + '</button>');
      root.querySelector('[data-act="retry"]').onclick = startRealize;
    }

    function startRealize() {
      revoke(); stopStream();   // free a prior preview blob + any leftover stream (Refaire / retry)
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { renderCamError(); return; }
      renderLoading();
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }).then(function (st) {
        stream = st;
        beginRecording();
      }, function () { renderCamError(); });
    }

    function beginRecording() {
      pickMime();
      chunks = []; blob = null;
      try { recorder = recMime ? new MediaRecorder(stream, { mimeType: recMime }) : new MediaRecorder(stream); }
      catch (e) { try { recorder = new MediaRecorder(stream); } catch (e2) { renderCamError(); return; } }
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recorder.onstop = function () {
        blob = new Blob(chunks, { type: recMime || "video/webm" });
        renderPreview();
      };

      // Realization screen: title + meta + live camera + countdown; record + timer start together.
      var s = data.snapshot || {};
      view('<div class="defi-kicker">🎬 ' + esc(s.title || epTitle()) + '</div>' +
        (s.subtitle ? '<p class="defi-sub">' + esc(s.subtitle) + '</p>' : "") +
        metaChips(s) +
        '<span class="defi-badge-rec">' + esc(t("defiRecording")) + '</span>' +
        '<div class="defi-clock" id="defiClock">' + esc(durSec() ? fmtSec(durSec()) : "0:00") + '</div>' +
        '<video class="defi-video" id="defiCam" autoplay playsinline muted></video>' +
        '<div class="defi-actions solo">' +
          '<button type="button" class="suite-btn suite-btn-primary" data-act="stop">⏹ ' + esc(t("defiStop")) + '</button>' +
        '</div>');
      var vid = document.getElementById("defiCam");
      try { vid.srcObject = stream; } catch (e) { vid.src = ""; }
      root.querySelector('[data-act="stop"]').onclick = stopRecording;

      try { recorder.start(); } catch (e) { renderCamError(); return; }
      startTimer();
    }

    function startTimer() {
      clearTimer();
      var count = durSec();
      tDur = count;
      if (count > 0) {
        tEnd = Date.now() + count * 1000;
        tk = setInterval(function () {
          var rem = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
          var el = document.getElementById("defiClock");
          if (el) { el.textContent = fmtSec(rem); el.classList.toggle("is-low", rem <= 10); }
          if (rem <= 0) { stopRecording(); }
        }, 200);
      } else {
        // No fixed duration → count elapsed time up; recipient stops manually.
        var start = Date.now();
        tk = setInterval(function () {
          var el = document.getElementById("defiClock");
          if (el) el.textContent = fmtSec(Math.round((Date.now() - start) / 1000));
        }, 250);
      }
    }

    function stopRecording() {
      clearTimer();
      try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) {}
      stopStream();   // release the camera/mic as soon as we stop
    }

    function renderPreview() {
      revoke();
      blobUrl = URL.createObjectURL(blob);
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiPreviewTitle")) + '</h1>' +
        '<video class="defi-video is-preview" src="' + blobUrl + '" controls playsinline></video>' +
        '<div class="defi-actions">' +
          '<button type="button" class="suite-btn suite-btn-ghost" data-act="redo">↻ ' + esc(t("defiRedo")) + '</button>' +
          '<button type="button" class="suite-btn suite-btn-primary" data-act="send">📤 ' + esc(t("defiSend")) + '</button>' +
        '</div>' +
        '<p class="defi-note">' + esc(t("defiPrivacyShort")) + '</p>');
      root.querySelector('[data-act="redo"]').onclick = startRealize;
      root.querySelector('[data-act="send"]').onclick = doSend;
    }

    function fileName() { return "defi-" + slug(epTitle()) + "." + recExt; }

    function doSend() {
      if (!blob) return;
      var file = null;
      try { file = new File([blob], fileName(), { type: blob.type || recMime || "video/webm" }); } catch (e) { file = null; }
      var shareData = file ? { files: [file], title: epTitle(), text: tf("defiShareText", { title: epTitle() }) } : null;
      var canShareFiles = !!(file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share);
      if (canShareFiles) {
        navigator.share(shareData).then(markDoneAndThank, function (err) {
          // Only a genuine user-cancel (AbortError) stays on preview. Any other
          // rejection (NotAllowedError, etc.) falls through to the download so the
          // recipient always has a working, on-device delivery path.
          if (err && err.name === "AbortError") return;
          renderDownloadFallback();
        });
      } else {
        renderDownloadFallback();
      }
    }

    function renderDownloadFallback() {
      revoke(); blobUrl = URL.createObjectURL(blob);
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">' + esc(t("defiSend")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiDownloadHint")) + '</p>' +
        '<video class="defi-video is-preview" src="' + blobUrl + '" controls playsinline></video>' +
        '<div class="defi-actions solo">' +
          '<a class="suite-btn suite-btn-primary" id="defiDl" href="' + blobUrl + '" download="' + esc(fileName()) + '">⬇ ' + esc(t("defiDownload")) + '</a>' +
        '</div>');
      var dl = document.getElementById("defiDl");
      if (dl) dl.addEventListener("click", function () { setTimeout(markDoneAndThank, 400); });
    }

    function markDoneAndThank() {
      if (sb && TOKEN) { try { sb.rpc("mark_challenge_done", { p_token: TOKEN }); } catch (e) {} }
      revoke();
      view('<div class="defi-kicker">🎬 ' + esc(epTitle()) + '</div>' +
        '<h1 class="defi-title">🎉 ' + esc(t("defiSharedTitle")) + '</h1>' +
        '<p class="defi-sub">' + esc(t("defiSharedSub")) + '</p>' +
        '<a class="suite-btn suite-btn-ghost" href="./welcome.html">🏠 ' + esc(t("navHome")) + '</a>');
    }

    // ── boot ────────────────────────────────────────────────────────────
    function boot() {
      if (!TOKEN) { renderError(); return; }
      if (!sb) { renderError(t("defiNotFoundSub")); return; }
      renderLoading();
      Promise.resolve(sb.rpc("get_challenge_by_token", { p_token: TOKEN })).then(function (res) {
        var row = res && res.data && res.data[0];
        if (res && res.error) { renderError(); return; }
        if (!row) { renderError(); return; }
        data = row;
        try { sb.rpc("mark_challenge_opened", { p_token: TOKEN }); } catch (e) {}
        renderWelcome();
      }, function () { renderError(); });
    }

    window.addEventListener("pagehide", function () { clearTimer(); stopStream(); });
    if (S && S.applyLocale) { try { S.applyLocale(); } catch (e) {} }
    boot();
  })();
  </script>
</body>
</html>
