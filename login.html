<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Connexion à Acto — The Impro Studio" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0814" />
<title>Connexion — Acto</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260712" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=2026072948" />
</head>
<body>
  <!-- Stage backdrop -->
  <div class="stage-backdrop" aria-hidden="true">
    <div class="spotlight spotlight-1"></div>
    <div class="spotlight spotlight-2"></div>
    <div class="spotlight spotlight-3"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- ============================================================
       DEDICATED LOGIN PAGE. auth.js recognises this page by the
       presence of #authScreen (and the absence of #mainApp): it renders
       the form for signed-out visitors and, once signed in, forwards to
       the Studio (welcome.html). The Studio + Match rapide pages bounce
       their signed-out visitors here.
       ============================================================ -->
  <section class="auth-screen" id="authScreen" hidden>
    <div class="auth-langbar">
      <label class="auth-lang"><span aria-hidden="true">🌐</span>
        <select id="authLangSelect" aria-label="Language"></select>
      </label>
    </div>

    <!-- La racine du site menait à un formulaire de connexion NU : ni logo, ni
         explication. Un curieux à qui on partage l'URL ne pouvait pas savoir ce
         qu'est Acto, et repartait. On dit qui on est avant de demander un compte. -->
    <header class="auth-hero">
      <img class="auth-hero-logo" src="./assets/logo.png?v=20260712" alt="Acto — The Impro Studio" />
      <p class="auth-hero-tagline" id="authTaglineText"></p>
    </header>

    <div class="auth-card">
      <h2 class="auth-title" id="authLoginTitle"></h2>
      <form class="auth-form" id="authLoginForm" novalidate>
        <label class="auth-field">
          <span id="authEmailLabel"></span>
          <input type="email" id="authLoginEmail" autocomplete="email" required />
        </label>
        <label class="auth-field">
          <span id="authPasswordLabel"></span>
          <input type="password" id="authLoginPassword" autocomplete="current-password" required />
        </label>
        <p class="auth-error" id="authLoginError" hidden></p>
        <button type="submit" class="auth-btn auth-btn-primary" id="authLoginSubmitBtn"></button>
        <button type="button" class="auth-link" id="authForgotBtn"></button>
      </form>
      <div class="auth-or"><span id="authOrText"></span></div>
      <div class="auth-oauth">
        <button type="button" class="auth-btn auth-btn-oauth" id="authGoogleBtn">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          <span id="authGoogleText"></span>
        </button>
        <button type="button" class="auth-btn auth-btn-oauth" id="authAppleBtn">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11.18 8.46c-.02-1.7 1.39-2.52 1.46-2.56-.8-1.16-2.04-1.32-2.48-1.34-1.05-.11-2.06.62-2.59.62-.54 0-1.36-.6-2.24-.59-1.15.02-2.21.67-2.8 1.7-1.2 2.08-.31 5.15.86 6.84.57.83 1.25 1.75 2.14 1.72.86-.03 1.18-.55 2.22-.55s1.33.55 2.24.54c.93-.02 1.51-.84 2.08-1.67.66-.96.93-1.89.94-1.94-.02-.01-1.8-.69-1.82-2.73zM9.5 3.5c.48-.58.8-1.39.71-2.2-.69.03-1.52.46-2.01 1.04-.44.51-.83 1.33-.73 2.12.77.06 1.55-.39 2.03-.96z"/></svg>
          <span id="authAppleText"></span>
        </button>
        <button type="button" class="auth-link auth-magic" id="authMagicBtn"></button>
      </div>
      <div class="auth-divider">
        <span id="authNoAccountText"></span>
        <button type="button" class="auth-btn auth-btn-secondary" id="authOpenSignupBtn"></button>
      </div>
    </div>

    <!-- Essayer sans compte. warmups.html et inspirations.html sont DÉJÀ des
         pages publiques (ni auth.js ni portier) mais n'étaient liées de nulle
         part pour un visiteur déconnecté : le contenu qui aurait pu le convaincre
         existait et restait invisible. Zéro travail backend. -->
    <div class="auth-try" id="authTryBlock">
      <span class="auth-try-title" id="authTryTitleText"></span>
      <div class="auth-try-links">
        <a class="auth-btn auth-btn-secondary" href="./warmups.html?draw=1" id="authTryWarmupLink"></a>
        <a class="auth-btn auth-btn-secondary" href="./inspirations.html" id="authTryInspireLink"></a>
      </div>
    </div>

    <!-- Email pending screen — replaces the form after a successful sign-up -->
    <div class="auth-card auth-pending" id="authPendingCard" hidden>
      <div class="auth-pending-icon" aria-hidden="true">📬</div>
      <h2 class="auth-title" id="authPendingTitle"></h2>
      <p class="auth-pending-msg" id="authPendingMsg"></p>
      <div class="auth-pending-actions">
        <button type="button" class="auth-btn auth-btn-secondary" id="authResendBtn"></button>
        <button type="button" class="auth-link" id="authBackToLoginBtn"></button>
      </div>
      <p class="auth-error" id="authPendingError" hidden></p>
    </div>
  </section>

  <!-- Signup dialog -->
  <dialog class="signup-dialog themes-dialog" id="signupDialog" aria-labelledby="authSignupTitle">
    <form method="dialog" class="dlg-head">
      <h2 id="authSignupTitle"></h2>
      <label class="auth-lang auth-lang-signup"><span aria-hidden="true">🌐</span>
        <select id="authSignupLangSelect" aria-label="Language"></select>
      </label>
      <button type="button" class="dlg-close" id="authSignupCloseBtn" aria-label="Close">✕</button>
    </form>
    <form class="signup-form" id="authSignupForm" novalidate>
      <div class="dlg-body">
        <div class="form-row">
          <label class="auth-field">
            <span id="authSignupPrenomLabel"></span>
            <input type="text" id="authSignupPrenom" autocomplete="given-name" required />
          </label>
          <label class="auth-field">
            <span id="authSignupNomLabel"></span>
            <input type="text" id="authSignupNom" autocomplete="family-name" required />
          </label>
        </div>
        <fieldset class="auth-field auth-field-fieldset">
          <legend id="authSignupDobLabel"></legend>
          <div class="auth-dob-row">
            <label for="authSignupDobDay" class="visually-hidden">Jour</label>
            <input type="text" inputmode="numeric" autocomplete="bday-day"
                   id="authSignupDobDay" maxlength="2" pattern="[0-9]*"
                   placeholder="JJ" required />
            <span class="auth-dob-sep" aria-hidden="true">/</span>
            <label for="authSignupDobMonth" class="visually-hidden">Mois</label>
            <input type="text" inputmode="numeric" autocomplete="bday-month"
                   id="authSignupDobMonth" maxlength="2" pattern="[0-9]*"
                   placeholder="MM" required />
            <span class="auth-dob-sep" aria-hidden="true">/</span>
            <label for="authSignupDobYear" class="visually-hidden">Année</label>
            <input type="text" inputmode="numeric" autocomplete="bday-year"
                   id="authSignupDobYear" maxlength="4" pattern="[0-9]*"
                   placeholder="AAAA" required />
          </div>
        </fieldset>
        <label class="auth-field">
          <span id="authSignupStageNameLabel"></span>
          <input type="text" id="authSignupStageName" autocomplete="nickname" maxlength="40" required />
        </label>
        <label class="auth-field">
          <span id="authSignupEmailLabel"></span>
          <input type="email" id="authSignupEmail" autocomplete="email" required />
        </label>
        <label class="auth-field">
          <span id="authSignupPasswordLabel"></span>
          <input type="password" id="authSignupPassword" autocomplete="new-password" minlength="8" required />
        </label>
        <label class="auth-field">
          <span id="authSignupConfirmLabel"></span>
          <input type="password" id="authSignupConfirm" autocomplete="new-password" minlength="8" required />
        </label>
        <p class="auth-error" id="authSignupError" hidden></p>
      </div>
      <div class="dlg-actions">
        <button type="submit" class="auth-btn auth-btn-primary" id="authSignupSubmitBtn"></button>
      </div>
    </form>
  </dialog>

  <!-- Set-new-password dialog. Shown after the user clicks the reset link in
       the "mot de passe oublié" email (Supabase PASSWORD_RECOVERY event). -->
  <dialog class="signup-dialog themes-dialog" id="resetPasswordDialog" aria-labelledby="authResetTitle">
    <form method="dialog" class="dlg-head">
      <h2 id="authResetTitle"></h2>
    </form>
    <form class="signup-form" id="resetPasswordForm" novalidate>
      <div class="dlg-body">
        <label class="auth-field">
          <span id="authResetPasswordLabel"></span>
          <input type="password" id="authResetPassword" autocomplete="new-password" minlength="8" required />
        </label>
        <label class="auth-field">
          <span id="authResetConfirmLabel"></span>
          <input type="password" id="authResetConfirm" autocomplete="new-password" minlength="8" required />
        </label>
        <p class="auth-error" id="authResetError" hidden></p>
      </div>
      <div class="dlg-actions">
        <button type="submit" class="auth-btn auth-btn-primary" id="authResetSubmitBtn"></button>
      </div>
    </form>
  </dialog>

  <!-- Supabase SDK (pinned + SRI, same as the other pages) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"
          integrity="sha384-8ljL080xacUYrqBXUJRcP68fd1dVCh9qK/xi9QMzxUgOVNycXp0s6mBZAjBMp9W0"
          crossorigin="anonymous"></script>
  <!-- Only what the login form needs: config + utils + the i18n bundle + the
       auth controller. No app.js (the Match rapide) — this page is login-only. -->
  <script src="./js/config.js?v=2026072948"></script>
  <script src="./js/utils.js?v=2026072948"></script>
  <script src="./data/all.js?v=2026072948"></script>
  <script src="./js/auth.js?v=2026072948"></script>
</body>
</html>
