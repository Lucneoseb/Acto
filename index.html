<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0814" />
<!-- Acto's entry point now sends everyone to the Studio (/welcome), which is
     login-gated and itself bounces signed-out visitors to the login page
     (/login). Kept as a tiny redirect so old /index.html links still work. -->
<meta http-equiv="refresh" content="0; url=welcome.html" />
<title>Acto — The Impro Studio</title>
<style>
  html, body { height: 100%; margin: 0; background: #0c0814; color: #f5f0ea;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  a { color: #f5c451; }
</style>
<script>
  // Immediate client-side redirect (covers browsers that ignore meta-refresh
  // timing). location.replace so Back doesn't trap the user on this page.
  try { window.location.replace("welcome.html"); } catch (e) { window.location.href = "welcome.html"; }
</script>
</head>
<body>
  <div class="wrap"><p>Redirection vers <a href="welcome.html">Acto</a>…</p></div>
</body>
</html>
