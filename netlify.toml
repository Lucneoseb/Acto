# Netlify config — static site, no build step.
# Publish dir is the repo root.

[build]
  publish = "."

# ---------- Security & privacy headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options       = "nosniff"
    X-Frame-Options              = "SAMEORIGIN"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"

# ---------- Caching ----------
# Logo never changes content for the same URL → long-lived immutable cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# i18n + bundled data updates with deploys → 1-day cache, must-revalidate.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# JS modules update with deploys → short cache, must-revalidate.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# HTML must always revalidate so a deploy reaches users immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache"
