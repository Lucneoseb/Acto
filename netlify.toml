# Netlify config — static site, no build step.
# Publish dir is the repo root.

[build]
  publish = "."

# ---------- Security & privacy headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options       = "nosniff"
    X-Frame-Options              = "SAMEORIGIN"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"

# ---------- Caching ----------
# Logo never changes content for the same URL → long-lived immutable cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# i18n + bundled data update with deploys. "no-cache" = browser must revalidate
# on every load (lightweight 304 if unchanged, full body if changed). This way
# bug fixes reach users instantly, no need to wait for cache expiry.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# JS modules: same logic — push a fix, all users see it on the next page load.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# HTML must always revalidate so a deploy reaches users immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache"
