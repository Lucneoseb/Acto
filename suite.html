<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Acto · The Impro Studio — préparer et animer matchs, spectacles et entraînements d'impro" />
<meta name="theme-color" content="#0c0814" />
<title>Acto — Impro Suite</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260626" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=20260626" />
<link rel="stylesheet" href="suite.css?v=20260626" />
</head>
<body class="suite-body">
  <!-- Same theatre backdrop as the rest of the app. -->
  <div class="stage-backdrop" aria-hidden="true">
    <div class="spotlight spotlight-1"></div>
    <div class="spotlight spotlight-2"></div>
    <div class="spotlight spotlight-3"></div>
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
  </div>

  <!-- Top chrome: locale + Inspirations + quick-draw link -->
  <div class="top-actions suite-topbar">
    <a class="top-trigger inspire-trigger" href="./inspirations.html" aria-label="Inspirations">
      <span aria-hidden="true" style="font-size:1.05rem;">🎭</span>
      <span data-i18n="inspireBtn">Inspirations</span>
    </a>
    <a class="top-trigger suite-quickdraw" href="./index.html" aria-label="Tirage rapide">
      <span aria-hidden="true" style="font-size:1.05rem;">🎲</span>
      <span data-i18n="backToApp">Tirage rapide</span>
    </a>
    <label class="suite-locale-wrap" aria-label="Langue">
      <select id="suiteLocale" class="suite-locale"></select>
    </label>
  </div>

  <header class="hero suite-hero">
    <a class="hero-logo-link" href="#/" aria-label="Acto - The Impro Studio">
      <img class="hero-logo suite-hero-logo" src="./assets/logo.png?v=20260626" alt="Acto - The Impro Studio" />
    </a>
  </header>

  <main class="suite-shell">
    <nav class="suite-sectionnav" id="suiteSectionNav" hidden aria-label="Sections"></nav>
    <div id="suiteRoot" class="suite-root"><!-- sections render here --></div>
  </main>

  <footer class="footer suite-footer">
    <p id="suiteFooter"></p>
  </footer>

  <!-- Data bundle (locales/ui/data) then the suite modules. -->
  <script src="./data/all.js?v=20260626"></script>
  <script src="./js/suite/i18n.js?v=20260626"></script>
  <script src="./js/suite/core.js?v=20260626"></script>
  <script src="./js/suite/match.js?v=20260626"></script>
  <script src="./js/suite/live.js?v=20260626"></script>
  <script src="./js/suite/discover.js?v=20260626"></script>
  <script src="./js/suite/shell.js?v=20260626"></script>
</body>
</html>
