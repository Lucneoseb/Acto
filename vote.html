<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0814" />
<title>Acto — Vote du public</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260716" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=2026072949" />
<link rel="stylesheet" href="suite.css?v=2026072949" />
<style>
  .suite-vote-body { min-height: 100svh; }
  .vote-wrap { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; padding: 1.6rem 1.1rem; text-align: center; }
  .vote-logo { width: 64px; height: auto; opacity: 0.9; }
  .vote-title { font-family: "Bebas Neue", sans-serif; font-size: 1.7rem; letter-spacing: 1px; margin: 0; color: var(--ink); }
  .vote-sub { color: var(--ink-muted); margin: 0; max-width: 26rem; }
  .vote-clock { font-family: "Bebas Neue", monospace; font-size: 2.6rem; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
  .vote-teams { display: flex; gap: 0.9rem; width: 100%; max-width: 30rem; }
  .vote-team { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; cursor: pointer; appearance: none;
    border: 2px solid color-mix(in srgb, var(--team, #888) 55%, transparent); background: color-mix(in srgb, var(--team, #888) 12%, transparent);
    border-radius: 18px; padding: 1.3rem 0.8rem; color: var(--ink); font: 700 1.05rem/1.1 "Inter", sans-serif; transition: transform .12s, box-shadow .15s, border-color .15s; }
  .vote-team:hover { transform: translateY(-2px); }
  .vote-team.is-chosen { border-color: var(--team, var(--gold)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--team, var(--gold)) 35%, transparent); background: color-mix(in srgb, var(--team, #888) 24%, transparent); }
  .vote-team-logo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.08); }
  .vote-team-dot { width: 56px; height: 56px; border-radius: 50%; background: var(--team, #888); }
  .vote-team-nm { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .vote-thanks { color: var(--gold-soft); font-weight: 700; }
  .vote-error { color: #ef6b6b; font-weight: 700; margin: 0; max-width: 26rem; }
  .vote-result-label { font: 700 0.9rem/1 "Inter"; letter-spacing: .12em; color: var(--gold-soft); text-transform: uppercase; }
  .vote-result-main { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.6rem,7vw,2.6rem); color: var(--gold); letter-spacing: .02em; line-height: 1.05; max-width: 32rem; }
  .vote-result-score { font-family: "Bebas Neue", monospace; font-size: 2.2rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .vote-stars { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 26rem; }
  .vote-star { display: flex; align-items: center; gap: 0.7rem; appearance: none; cursor: pointer; text-align: left;
    border: 1px solid color-mix(in srgb, var(--team,#888) 40%, transparent); background: color-mix(in srgb, var(--team,#888) 8%, transparent);
    border-radius: 12px; padding: 0.7rem 0.9rem; color: var(--ink); font: 600 1rem/1.1 "Inter", sans-serif; }
  .vote-star:hover { border-color: var(--gold); }
  .vote-star.is-chosen { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }
  .vote-star-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--team,#888); flex: 0 0 auto; }
  /* .acto-discover est dans suite.css : join.html en a besoin aussi, et un style
     posé ici ne l'aurait jamais atteint (il se serait affiché en lien bleu nu). */
  .vote-code-in { font-family: "Bebas Neue", monospace; font-size: 2rem; letter-spacing: .4rem; text-align: center; text-transform: uppercase; width: 10rem; padding: .35rem .5rem; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--gold) 40%, transparent); background: color-mix(in srgb, var(--bg-velvet) 70%, transparent); color: var(--gold-soft); }
</style>
</head>
<body class="suite-body suite-vote-body">
  <div class="vote-wrap">
    <img class="vote-logo" src="./assets/logo.png?v=20260716" alt="Acto" />
    <div id="voteRoot"></div>
    <!-- Cette page est le SEUL contact d'un spectateur avec Acto : il scanne un
         QR pendant le match, vote, voit le résultat… et n'avait ensuite aucun
         moyen de savoir ce qu'est l'application. On lui laisse une porte, hors
         du flux de vote pour ne pas le distraire pendant qu'il joue son rôle.
         welcome.html s'auto-route : connecté → le Studio, déconnecté → la page
         de connexion, qui porte le logo, la promesse et les essais sans compte. -->
    <!-- Le texte est écrit ici en dur, pas laissé vide : si i18n.js ou core.js
         ne se charge pas, t() renvoie la CLÉ, et le spectateur lisait
         « publicDiscover ». Si le JS ne tourne pas du tout, il voyait une boîte
         cliquable sans le moindre mot. Le script ci-dessous ne remplace ce
         texte que s'il a réellement obtenu une traduction. -->
    <a class="acto-discover" href="./welcome.html">
      <span id="voteDiscoverText">Découvrir Acto</span>
      <small id="voteDiscoverSub">Le studio d’impro qui a fait tourner ce match.</small>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"
          integrity="sha384-8ljL080xacUYrqBXUJRcP68fd1dVCh9qK/xi9QMzxUgOVNycXp0s6mBZAjBMp9W0"
          crossorigin="anonymous"></script>
  <script src="./js/config.js?v=2026072949"></script>
  <script src="./data/all.js?v=2026072949"></script>
  <script src="./js/suite/i18n.js?v=2026072949"></script>
  <script src="./js/suite/core.js?v=2026072949"></script>
  <script>
  (function () {
    "use strict";
    var S = window.ActoSuite;
    function t(k) { return S ? S.t(k) : k; }
    function tf(k, v) { return S ? S.tf(k, v) : k; }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function fmtSec(s) { return S ? S.formatSec(s) : (s + "s"); }

    try {
      var CFG = window.actoConfig.supabase;
      window.actoSuiteSb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    } catch (e) { /* ignore */ }
    var sb = window.actoSuiteSb;

    var root = document.getElementById("voteRoot");
    var params = new URLSearchParams(location.search);
    var CODE = (params.get("code") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");

    // Stable anonymous per-device voter key.
    var VOTER = "";
    try {
      VOTER = localStorage.getItem("acto-voter:v1") || "";
      if (!VOTER) { VOTER = "v_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("acto-voter:v1", VOTER); }
    } catch (e) { VOTER = "v_" + Math.random().toString(36).slice(2); }

    var snap = null;            // latest live snapshot from the presenter
    var myChoice = { round: -1, choice: null };   // remembered impro vote for the current round
    var myStar = null;          // remembered star pick (player name)
    var clockTimer = null;
    var waitedTooLong = false;   // aucun snapshot reçu au bout d'un délai → code probablement erroné

    /* ---------- snapshot inflow (same channels as the public display) ---------- */
    var SNAP_KEY = "acto-live:snap:v1", CHANNEL = "acto-live";
    function applyIncoming(s) { if (s && s.type === "snapshot" && String(s.code || "").toUpperCase() === CODE) { snap = s; render(); } }
    try { var raw = localStorage.getItem(SNAP_KEY); if (raw) { var s0 = JSON.parse(raw); if (s0 && s0.ts && (Date.now() - s0.ts) < 300000 && String(s0.code || "").toUpperCase() === CODE) snap = s0; } } catch (e) {}
    try { var bc = new BroadcastChannel(CHANNEL); bc.onmessage = function (ev) { applyIncoming(ev.data); }; } catch (e) {}
    window.addEventListener("storage", function (e) { if (e.key === SNAP_KEY && e.newValue) { try { applyIncoming(JSON.parse(e.newValue)); } catch (err) {} } });
    if (sb && CODE) {
      try {
        var ch = sb.channel("acto-live:" + CODE, { config: { broadcast: { self: false } } });
        ch.on("broadcast", { event: "snap" }, function (m) { if (m && m.payload) applyIncoming(m.payload); });
        ch.subscribe(function (st) { if (st === "SUBSCRIBED") { try { ch.send({ type: "broadcast", event: "hello", payload: {} }); } catch (e) {} } });
      } catch (e) {}
    }

    /* ---------- voting actions ---------- */
    // Le vote partait en « fire and forget » : on affichait « Merci, vote
    // enregistré ! » même quand l'appel échouait (hors ligne, mauvais code,
    // réseau de salle saturé). On attend donc la réponse avant de remercier,
    // et on le dit franchement en cas d'échec.
    // « idle » → rien envoyé · « sending » → en vol · « ok » → confirmé par le
    // serveur · « error » → refusé, hors ligne, ou resté sans réponse.
    // Le délai est indispensable : sur un réseau de salle saturé la requête ne
    // rejette jamais, elle PEND — et on remerciait alors pour un vote fantôme.
    var voteState = "idle";
    function sendVote(promise, onFail) {
      voteState = "sending"; render();
      var done = false;
      var to = setTimeout(function () {
        if (done) return; done = true;
        voteState = "error"; onFail(); render();
      }, 8000);
      Promise.resolve(promise).then(function (res) {
        if (done) return; done = true; clearTimeout(to);
        if (res && res.error) { voteState = "error"; onFail(); } else { voteState = "ok"; }
        render();
      }, function () {
        if (done) return; done = true; clearTimeout(to);
        voteState = "error"; onFail(); render();
      });
    }
    function castImpro(choice) {
      var prev = myChoice;
      myChoice = { round: snap ? snap.segIndex : -1, choice: choice };
      if (!sb || !CODE || !snap) { voteState = "error"; myChoice = prev; render(); return; }
      try {
        sendVote(sb.rpc("cast_live_vote", { p_code: CODE, p_round: snap.segIndex, p_voter: VOTER, p_choice: choice }),
                 function () { myChoice = prev; });
      } catch (e) { voteState = "error"; myChoice = prev; render(); }
    }
    function castStar(player) {
      var prev = myStar;
      myStar = player;
      if (!sb || !CODE) { voteState = "error"; myStar = prev; render(); return; }
      try {
        sendVote(sb.rpc("cast_star_vote", { p_code: CODE, p_voter: VOTER, p_player: player }),
                 function () { myStar = prev; });
      } catch (e) { voteState = "error"; myStar = prev; render(); }
    }

    /* ---------- render ---------- */
    function teamName(i) { var tm = snap && snap.teams && snap.teams[i]; return (tm && tm.name) || (i === 0 ? t("teamA") : t("teamB")); }
    function teamColor(i) { var tm = snap && snap.teams && snap.teams[i]; return (tm && tm.color) || "#888"; }

    function remaining() {
      if (!snap || !snap.timer) return 0;
      var tm = snap.timer;
      if (tm.running && tm.endAt) return Math.max(0, Math.round((tm.endAt - Date.now()) / 1000));
      return tm.remaining || 0;
    }
    function tickClock() { var el = document.getElementById("voteClock"); if (el) el.textContent = fmtSec(remaining()); }

    function teamBtn(i) {
      var tm = snap.teams[i] || {};
      var chosen = (myChoice.round === snap.segIndex && myChoice.choice === i);
      var logo = tm.logo ? '<img class="vote-team-logo" src="' + esc(tm.logo) + '" alt="" />' : '<span class="vote-team-dot"></span>';
      return '<button type="button" class="vote-team' + (chosen ? " is-chosen" : "") + '" data-choice="' + i + '" style="--team:' + esc(teamColor(i)) + '">' +
        logo + '<span class="vote-team-nm">' + esc(teamName(i)) + '</span>' + '</button>';
    }

    function render() {
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
      if (!CODE) { return renderCodeEntry(); }
      // Un code erroné (ou un match pas encore lancé) laissait le spectateur sur
      // un spinner éternel, sans un mot. Au bout d'un moment on l'aide.
      if (!snap) { return waitedTooLong ? renderNotFound() : wait(t("voteWaiting")); }

      var vr = snap.voteResult;
      // 1) Result revealed for the current impro → show it (only during the vote phase,
      //    so a stale tally never shadows the stars vote or the waiting screen).
      if (snap.phase === "vote" && vr && vr.round === snap.segIndex) {
        var win = vr.a > vr.b ? 0 : (vr.b > vr.a ? 1 : -1);
        var main = (win < 0)
          ? tf("voteTie", { a: vr.a, b: vr.b })
          : tf("voteWinsBy", { team: teamName(win), a: Math.max(vr.a, vr.b), b: Math.min(vr.a, vr.b) });
        root.innerHTML =
          '<div class="vote-result-label">' + esc(t("voteResultTitle")) + '</div>' +
          '<div class="vote-result-main" style="' + (win >= 0 ? "color:" + esc(teamColor(win)) : "") + '">' + esc(main) + '</div>' +
          '<div class="vote-result-score">' + vr.a + ' — ' + vr.b + '</div>';
        return;
      }
      // 2) Star ranking open (end of match) → vote for a jouteur.
      if (snap.phase === "stars" && snap.roster && snap.roster.length) {
        return renderStars();
      }
      // 3) Impro vote open.
      if (snap.phase === "vote") {
        var thanks = (myChoice.round === snap.segIndex && myChoice.choice != null);
        root.innerHTML =
          '<div id="voteClock" class="vote-clock">' + esc(fmtSec(remaining())) + '</div>' +
          '<h1 class="vote-title">' + esc(t("votePrompt")) + '</h1>' +
          '<div class="vote-teams">' + teamBtn(0) + teamBtn(1) + '</div>' +
          (voteState === "sending" ? '<p class="vote-sub">' + esc(t("voteSending")) + '</p>'
            : voteState === "error" ? '<p class="vote-error">' + esc(t("voteFailed")) + '</p>'
            : (thanks && voteState === "ok") ? '<p class="vote-thanks">' + esc(t("voteThanks")) + ' ' + esc(t("voteChangeHint")) + '</p>'
            : '<p class="vote-sub">' + esc(t("voteTapTeam")) + '</p>');
        root.querySelectorAll(".vote-team").forEach(function (b) { b.onclick = function () { castImpro(+b.getAttribute("data-choice")); }; });
        clockTimer = setInterval(tickClock, 250);
        return;
      }
      // 4) Match terminé : les téléphones du public restaient bloqués sur
      //    « en attente de la prochaine impro » indéfiniment. On clôt proprement.
      if (snap.phase === "done") { return renderEnded(); }
      // 5) Otherwise → waiting between impros.
      wait(t("voteWaiting"));
    }

    function renderEnded() {
      var a = (snap.teams && snap.teams[0] && snap.teams[0].score) || 0;
      var b = (snap.teams && snap.teams[1] && snap.teams[1].score) || 0;
      var win = a > b ? 0 : (b > a ? 1 : -1);
      root.innerHTML =
        '<h1 class="vote-title">🎭 ' + esc(t("voteEndedTitle")) + '</h1>' +
        (snap.showScores !== false
          ? '<div class="vote-result-main"' + (win >= 0 ? ' style="color:' + esc(teamColor(win)) + '"' : '') + '>' +
              esc(win < 0 ? tf("voteTie", { a: a, b: b }) : teamName(win)) + '</div>' +
            '<div class="vote-result-score">' + a + ' — ' + b + '</div>'
          : '') +
        '<p class="vote-sub">' + esc(t("voteEndedSub")) + '</p>';
    }

    function renderNotFound() {
      root.innerHTML =
        '<h1 class="vote-title">🤔 ' + esc(t("voteNotFoundTitle")) + '</h1>' +
        '<p class="vote-sub">' + esc(t("voteNotFoundSub")) + '</p>' +
        '<p class="vote-sub" style="opacity:.6">' + esc(t("voteCodeLabel")) + ' ' + esc(CODE) + '</p>' +
        '<button id="vAgain" class="suite-btn suite-btn-primary">' + esc(t("voteChangeCode")) + '</button>';
      document.getElementById("vAgain").onclick = function () { location.search = ""; };
    }

    function renderStars() {
      var chosen = myStar;
      var rows = snap.roster.map(function (p) {
        var key = p.key || p.name;   // team-qualified key so same-named players don't collide
        return '<button type="button" class="vote-star' + (chosen === key ? " is-chosen" : "") + '" data-nm="' + esc(key) + '" style="--team:' + esc(p.color || "#888") + '">' +
          '<span class="vote-star-dot"></span><span>' + esc(p.name) + '</span></button>';
      }).join("");
      root.innerHTML =
        '<h1 class="vote-title">⭐ ' + esc(t("voteStarTitle")) + '</h1>' +
        (voteState === "sending" ? '<p class="vote-sub">' + esc(t("voteSending")) + '</p>'
          : voteState === "error" ? '<p class="vote-error">' + esc(t("voteFailed")) + '</p>'
          : '<p class="vote-sub">' + esc((chosen && voteState === "ok") ? (t("voteThanks") + " " + t("voteChangeHint")) : t("voteStarPrompt")) + '</p>') +
        '<div class="vote-stars">' + rows + '</div>';
      root.querySelectorAll(".vote-star").forEach(function (b) { b.onclick = function () { castStar(b.getAttribute("data-nm")); }; });
    }

    function wait(msg) {
      root.innerHTML = '<div class="suite-auth-spinner" style="margin:0 auto 1rem"></div>' +
        '<h1 class="vote-title">' + esc(t("voteTitleWaiting")) + '</h1>' +
        '<p class="vote-sub">' + esc(msg) + '</p>' +
        (CODE ? '<p class="vote-sub" style="opacity:.6">' + esc(t("voteCodeLabel")) + ' ' + esc(CODE) + '</p>' : '');
    }

    function renderCodeEntry() {
      root.innerHTML =
        '<h1 class="vote-title">🗳 ' + esc(t("voteTitleWaiting")) + '</h1>' +
        '<p class="vote-sub">' + esc(t("voteEnterCode")) + '</p>' +
        '<div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">' +
          '<input id="vCode" class="vote-code-in" maxlength="6" placeholder="______" autocomplete="off" autocapitalize="characters" />' +
          '<button id="vGo" class="suite-btn suite-btn-primary">' + esc(t("voteGo")) + '</button>' +
        '</div>';
      var inp = document.getElementById("vCode");
      inp.oninput = function () { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
      inp.onkeydown = function (e) { if (e.key === "Enter") go(); };
      document.getElementById("vGo").onclick = go;
      function go() { var v = (inp.value || "").trim().toUpperCase(); if (v.length >= 4) location.search = "?code=" + encodeURIComponent(v); }
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 40);
    }

    // Le lien de découverte vit dans le HTML (donc il survit à tous les états de
    // rendu), mais son texte doit suivre la langue choisie.
    (function () {
      // t() renvoie la CLÉ quand elle est introuvable : on ne remplace donc le
      // texte du HTML que si la traduction a réellement abouti.
      function poser(id, cle) {
        var el = document.getElementById(id); if (!el) return;
        var v = t(cle);
        if (v && v !== cle) el.textContent = v;
      }
      poser("voteDiscoverText", "publicDiscover");
      poser("voteDiscoverSub",  "publicDiscoverSub");
    })();

    if (!S) { root.textContent = "⚠"; return; }
    // Si rien n'arrive au bout de 12 s, c'est presque toujours un code erroné
    // ou un match pas encore lancé : on le dit et on propose de ressaisir.
    if (CODE) setTimeout(function () { if (!snap) { waitedTooLong = true; render(); } }, 12000);
    render();
  })();
  </script>
</body>
</html>
