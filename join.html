<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0c0814" />
<title>Acto — Écran live</title>
<link rel="icon" type="image/png" href="./assets/logo.png?v=20260711" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=2026072944" />
<link rel="stylesheet" href="suite.css?v=2026072944" />
</head>
<body class="suite-body suite-join-body">
  <!-- Code entry / mode picker (hidden once a screen is mounted) -->
  <div id="joinGate" class="join-gate">
    <img class="join-logo" src="./assets/logo.png?v=20260711" alt="Acto" />
    <div id="joinGateBody"></div>
    <!-- Même raison que sur vote.html : on arrive ici par un QR code, sans
         savoir ce qu'est Acto, et la page n'offrait aucune sortie. Le lien vit
         dans le portier (saisie du code) et disparaît donc avec lui dès qu'un
         écran public ou de filmage est monté — un lien n'a rien à faire sur un
         écran projeté en salle. -->
    <!-- Texte en dur, même raison que sur vote.html : sans i18n.js, t() renvoie
         la clé ; sans JS du tout, le lien serait une boîte vide. -->
    <a class="acto-discover" href="./welcome.html">
      <span id="joinDiscoverText">Découvrir Acto</span>
      <small id="joinDiscoverSub">Le studio d’impro qui a fait tourner ce match.</small>
    </a>
  </div>
  <!-- The public display / record screen mounts here -->
  <main class="suite-shell"><div id="joinRoot" class="suite-root"></div></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"
          integrity="sha384-8ljL080xacUYrqBXUJRcP68fd1dVCh9qK/xi9QMzxUgOVNycXp0s6mBZAjBMp9W0"
          crossorigin="anonymous"></script>
  <script src="./js/config.js?v=2026072944"></script>
  <script src="./data/all.js?v=2026072944"></script>
  <script src="./js/suite/i18n.js?v=2026072944"></script>
  <script src="./js/suite/core.js?v=2026072944"></script>
  <script src="./js/suite/live.js?v=2026072944"></script>
  <script>
  (function () {
    "use strict";
    var S = window.ActoSuite;
    function t(k) { return S ? S.t(k) : k; }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

    // Anon Supabase client so live.js Realtime can subscribe by code.
    try {
      var CFG = window.actoConfig.supabase;
      window.actoSuiteSb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    } catch (e) { /* ignore */ }

    var params = new URLSearchParams(location.search);
    var code = (params.get("code") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    var mode = (params.get("mode") || "").trim();
    var gate = document.getElementById("joinGate");
    var gateBody = document.getElementById("joinGateBody");
    var root = document.getElementById("joinRoot");

    // Le lien de découverte est dans le HTML du portier : son texte doit suivre
    // la langue, comme le reste du portier.
    (function () {
      // Même garde que sur vote.html : t() renvoie la clé si elle manque.
      function poser(id, cle) {
        var el = document.getElementById(id); if (!el) return;
        var v = t(cle);
        if (v && v !== cle) el.textContent = v;
      }
      poser("joinDiscoverText", "publicDiscover");
      poser("joinDiscoverSub",  "publicDiscoverSub");
    })();

    function mount(code, mode) {
      window.actoJoinCode = code;
      gate.hidden = true;
      if (mode === "record") window.ActoLive.mountRecord(root, backToGate);
      else window.ActoLive.mountDisplay(root);
      watchForSnapshot();
    }
    function watchForSnapshot() {
      // Still on the "waiting" board after a grace period? Wrong code or match not
      // started — surface a recovery affordance instead of an infinite spinner.
      setTimeout(function () {
        if (gate.hidden && root.querySelector(".disp-wait") && !root.querySelector(".join-wait-hint")) {
          var hint = document.createElement("div");
          hint.className = "join-wait-hint";
          hint.innerHTML = '<p>' + esc(t("joinNotFound")) + '</p>' +
            '<button type="button" class="suite-btn suite-btn-ghost" id="joinHintBack">' + esc(t("joinChangeCode")) + '</button>';
          (root.querySelector(".disp-wait") || root).appendChild(hint);
          var b = document.getElementById("joinHintBack");
          if (b) b.onclick = function () { code = ""; try { window.history.replaceState({}, "", "join.html"); } catch (e) {} backToGate(); };
        }
      }, 9000);
    }
    function backToGate() {
      try { window.ActoLive.cleanup(); } catch (e) {}
      window.actoJoinCode = null;
      root.innerHTML = "";
      gate.hidden = false;
      if (code) renderModePicker(code); else renderCodeEntry();
    }

    function renderCodeEntry() {
      gateBody.innerHTML =
        '<h1 class="join-title">' + esc(t("joinTitle")) + '</h1>' +
        '<p class="join-sub">' + esc(t("joinPrompt")) + '</p>' +
        '<div class="join-form">' +
          '<input type="text" id="joinCodeIn" class="join-code-in" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="______" />' +
          '<button type="button" id="joinGo" class="suite-btn suite-btn-primary">' + esc(t("joinGo")) + '</button>' +
        '</div>' +
        '<p class="join-err" id="joinErr" hidden></p>';
      var input = document.getElementById("joinCodeIn");
      input.oninput = function () {
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        var er = document.getElementById("joinErr"); if (er) er.hidden = true;   // clear stale error as the user retypes
      };
      input.onkeydown = function (e) { if (e.key === "Enter") go(); };
      document.getElementById("joinGo").onclick = go;
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 40);
      function go() {
        var v = (input.value || "").trim().toUpperCase();
        if (v.length < 4) { var er = document.getElementById("joinErr"); er.textContent = t("joinBadCode"); er.hidden = false; return; }
        code = v; renderModePicker(v);
      }
    }

    function renderModePicker(code) {
      gateBody.innerHTML =
        '<h1 class="join-title">' + esc(t("joinPickMode")) + '</h1>' +
        '<p class="join-sub join-code-shown">' + esc(code) + '</p>' +
        '<div class="join-modes">' +
          '<button type="button" class="join-mode" data-mode="display"><span class="join-mode-ic">🖥</span><span>' + esc(t("joinModeScreen")) + '</span></button>' +
          '<button type="button" class="join-mode" data-mode="record"><span class="join-mode-ic">🎥</span><span>' + esc(t("joinModeRecord")) + '</span></button>' +
        '</div>' +
        '<button type="button" class="suite-btn suite-btn-ghost join-change" id="joinChange">' + esc(t("joinChangeCode")) + '</button>';
      gateBody.querySelectorAll(".join-mode").forEach(function (b) {
        b.onclick = function () { mount(code, b.getAttribute("data-mode")); };
      });
      var ch = document.getElementById("joinChange");
      if (ch) ch.onclick = function () { code = ""; window.history.replaceState({}, "", "join.html"); renderCodeEntry(); };
    }

    if (!S || !window.ActoLive) { gateBody.innerHTML = '<p class="join-err">⚠</p>'; return; }
    if (code && mode) mount(code, mode);
    else if (code) renderModePicker(code);
    else renderCodeEntry();
  })();
  </script>
</body>
</html>
